                position: absolute;

                top: 50%;
                margin-top: -238.5px;
                margin-left: -350px;
            }
            
            .banner-slide.left {
                transform: translateX(-320px) scale(0.85);
            }
            
            .banner-slide.right {
                transform: translateX(320px) scale(0.85);
            }
            
            .banner-slide.center {
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            }
            
            @media (max-width: 768px) {
                .banner-slide {
                    margin: 0;
                    transform: none !important;
                    position: absolute !important;
                    left: 0 !important;
                    top: 0 !important;
                    width: 100% !important;
                }
            }

        <script type="text/javascript"
            src="https://cdn.tailwindcss.com"></script>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const POS = ['center', 'right', 'left'];
            const TOTAL = 3;
            let currentIndex = 0;
            let timer;

            const slides = document.querySelectorAll('.banner-slide');
            const dots = document.querySelectorAll('.banner-dot');

            function renderCarousel() {
                slides.forEach((slide, i) => {
                    const pos = POS[(i - currentIndex + TOTAL) % TOTAL];
                    const baseClasses = 'banner-slide rounded-xl overflow-hidden shadow-lg cursor-pointer';
                    if (pos === 'center') {
                        slide.className = baseClasses + ' center';
                        slide.style.zIndex = '10';
                        slide.style.opacity = '1';
                    } else {
                        slide.className = baseClasses + ' ' + pos;
                        slide.style.zIndex = '1';
                        slide.style.opacity = '0.85';
                    }
                });
                dots.forEach((dot, i) => {
                    if (i === currentIndex) {
                        dot.className = 'banner-dot active w-[48px] h-1 rounded-md bg-purple-600 cursor-pointer transition-all duration-300';
                    } else {
                        dot.className = 'banner-dot w-[48px] h-1 rounded-md bg-gray-300 cursor-pointer transition-all duration-300';
                    }
                });
            }

            function jumpTo(index) {
                currentIndex = index;
                renderCarousel();
                resetTimer();
            }

            function nextSlide() {
                currentIndex = (currentIndex + 1) % TOTAL;
                renderCarousel();
                resetTimer();
            }

            function resetTimer() {
                clearInterval(timer);
                timer = setInterval(nextSlide, 3000);
            }

            slides.forEach((slide, i) => {
                slide.addEventListener('click', function() {
                    jumpTo(i);
                });
            });

            dots.forEach((dot, i) => {
                dot.addEventListener('click', function() {
                    jumpTo(i);
                });
            });

            let dragStartX = 0;
            let isDragging = false;
            const carousel = document.querySelector('.banner-carousel');
            const wrap = document.getElementById('bannerWrap');

            function setupDrag() {
                if (carousel) {
                    carousel.addEventListener('mousedown', function(e) {
                        dragStartX = e.clientX;
                        isDragging = true;
                        carousel.style.cursor = 'grabbing';
                        e.preventDefault();
                    });

                    document.addEventListener('mousemove', function(e) {
                        if (!isDragging) return;
                        e.preventDefault();
                    });

                    document.addEventListener('mouseup', function(e) {
                        if (!isDragging) return;
                        isDragging = false;
                        carousel.style.cursor = 'grab';

                        const diff = dragStartX - e.clientX;
                        if (Math.abs(diff) > 50) {
                            if (diff > 0) {
                                nextSlide();
                            } else {
                                currentIndex = (currentIndex - 1 + TOTAL) % TOTAL;
                                renderCarousel();
                                resetTimer();
                            }
                        }
                    });

                    carousel.style.cursor = 'grab';
                }

                if (wrap) {
                    wrap.addEventListener('touchstart', function(e) {
                        dragStartX = e.touches[0].clientX;
                    });
                    wrap.addEventListener('touchend', function(e) {
                        const diff = dragStartX - e.changedTouches[0].clientX;
                        if (Math.abs(diff) > 50) {
                            if (diff > 0) {
                                nextSlide();
                            } else {
                                currentIndex = (currentIndex - 1 + TOTAL) % TOTAL;
                                renderCarousel();
                                resetTimer();
                            }
                        }
                    });
                }
            }

            setupDrag();

            renderCarousel();
            resetTimer();

            function initFilterButtons() {
                const filterGroups = document.querySelectorAll('.filter-group');
                
                filterGroups.forEach(group => {
                    const buttons = group.querySelectorAll('.filter-btn');
                    
                    buttons.forEach(btn => {
                        btn.addEventListener('click', function() {
                            const groupName = this.getAttribute('data-group');
                            const value = this.getAttribute('data-value');
                            
                            buttons.forEach(b => {
                                b.classList.remove('bg-purple-600', 'text-white');
                                b.classList.add('bg-gray-100', 'text-gray-600');
                            });
                            
                            this.classList.remove('bg-gray-100', 'text-gray-600');
                            this.classList.add('bg-purple-600', 'text-white');
                            
                            const select = document.querySelector(`.filter-select[data-group="${groupName}"]`);
                            if (select) {
                                select.value = value;
                            }
                        });
                    });
                });

                const selects = document.querySelectorAll('.filter-select');
                selects.forEach(select => {
                    select.addEventListener('change', function() {
                        const groupName = this.getAttribute('data-group');
                        const value = this.value;
                        
                        const buttons = document.querySelectorAll(`.filter-btn[data-group="${groupName}"]`);
                        buttons.forEach(btn => {
                            if (btn.getAttribute('data-value') === value) {
                                btn.classList.remove('bg-gray-100', 'text-gray-600');
                                btn.classList.add('bg-purple-600', 'text-white');
                            } else {
                                btn.classList.remove('bg-purple-600', 'text-white');
                                btn.classList.add('bg-gray-100', 'text-gray-600');
                            }
                        });
                    });
                });
            }
            
            initFilterButtons();
        });
    </script>
