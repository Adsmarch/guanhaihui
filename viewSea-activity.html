<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观海深度 - 活动启示</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body class="bg-gray-50 min-h-screen">
    

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="mb-6">
            <div class="swiper banner-swiper rounded-lg overflow-hidden shadow-lg relative">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <a href="">
                        <img src="https://placehold.co/960x477" alt="" class="w-full object-cover">
                        </a>
                    </div>
                    <div class="swiper-slide">
                        <a href="">
                        <img src="https://placehold.co/960x477" alt="" class="w-full object-cover">
                     </a>
                    </div>
                    <div class="swiper-slide">
                        <a href="">
                        <img src="https://placehold.co/960x477" alt="" class="w-full object-cover">
                     </a>
                    </div>
                </div>
               
            </div>
                            <div class="swiper-pagination !bottom-[5%] md:!bottom-[25%]"></div>

        </div>

        <div class="bg-white rounded-lg  p-4 mb-6 mt-[40px]">
            <div class="flex flex-wrap gap-6 flex-col">
                <div class="flex items-center gap-2">
                    <span class="text-gray-500 text-sm font-medium">地点</span>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 bg-purple-600 text-white text-sm rounded-full">全部</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">北京</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">上海</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">深圳</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">广州</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">杭州</button>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 ">
                    <span class="text-gray-500 text-sm font-medium">主题</span>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">全部</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">AI</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">品牌增长</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">跨境</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">金融</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">企业服务</button>
                    </div>
                </div>
                
                <div class="flex items-center gap-2">
                    <span class="text-gray-500 text-sm font-medium">时间</span>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">全部</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">本周</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">本月</button>
                        <button class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-50 hover:text-purple-600 transition-colors">下月</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid md:grid-cols-4 grid-cols-2 gap-4">
            <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow cursor-pointer">
                <div class="relative">
                    <img src="https://placehold.co/960x477" alt="活动图片" class="w-full h-36 object-cover">
                    <span class="absolute top-2 left-2 px-2 py-1 bg-purple-600 text-white text-xs rounded">活动</span>
                </div>
                <div class="p-4 flex flex-col">
                    <h3 class="text-sm font-semibold text-gray-800 line-clamp-2 mb-2">活动标题占位 最多两行超过省略号显示 XXX创新大会</h3>
                    <div class=" items-center gap-2 text-gray-400 text-xs mb-3">
                        <span>时间：06.25-06.30</span>                      
                    </div>
                    <div class=" items-center gap-2 text-gray-400 text-xs mb-3">
                      
                        <span>地点：上海</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-400 text-xs">主办：XXXXXX</span>
                        <a href="">
                        <button  class="px-3 py-1 border border-purple-600 text-purple-600 text-xs rounded-full hover:bg-purple-600 hover:text-white transition-colors">立即报名</button>
                        </a>
                    </div>
                </div>
            </div>

           

          
           
       
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.tailwindcss.com"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const swiper = new Swiper('.banner-swiper', {
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },
            });
        });
    </script>
</body>
</html>
