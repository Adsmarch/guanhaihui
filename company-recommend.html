<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>观海深度 - 企务推荐</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <main class="max-w-7xl mx-auto px-4 py-6">
            <div
                class="flex items-center justify-center mb-4 relative mt-[80px]">
                <div
                    class="absolute top-[-20px] left-[27%]  md:top-[-18px] md:left-[41%]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="42"
                        height="32" viewBox="0 0 42 32" fill="none">
                        <path
                            d="M42 11.0983C41.86 11.0983 36.1865 11.0983 35.0132 11.1185C31.773 11.174 28.6295 11.7217 25.6337 12.9863C23.1291 14.0439 20.8969 15.5053 18.9549 17.4009C17.275 19.0415 15.8623 20.8841 14.7577 22.9513C13.9686 24.4304 13.4061 25.9953 12.9912 27.6132C12.6323 29.014 12.3702 30.4351 12.2124 31.8738C12.1996 31.9924 0.0738137 32 0 32C0 31.9369 0.203624 25.9271 1.41264 22.0022C2.1686 19.723 3.17399 17.5548 4.40591 15.4901C5.59457 13.4961 6.96394 11.6359 8.57512 9.95236C10.0998 8.35715 11.8153 6.99669 13.6861 5.82048C16.8423 3.83909 20.2453 2.44076 23.8596 1.53463C25.6261 1.09292 27.4129 0.757217 29.22 0.52248C30.7192 0.328127 32.221 0.184256 33.7303 0.131251C34.9266 0.088342 41.3891 0.00757217 41.9135 0C41.9389 0 42 7.40054 42 11.0983Z"
                            fill="#732DFE" />
                    </svg>
                </div>
                <span
                    class="text-[24px] font-bold text-gray-800 md:text-[40px]">企务推荐</span>
            </div>
            <div class="mb-6 ">
                <div
                    class="flex  justify-between items-center gap-2 mb-[20px] pb-[20px] border-b">
                    <div class="flex ">
                        <span
                            class="text-gray-500 text-sm mr-[20px] mt-[4px]">分类</span>
                        <div
                            class="fenlei hidden md:flex gap-2 flex-wrap gap-[30px]">
                            <button
                                class="px-3 py-1 bg-purple-600 text-white text-sm rounded-full">全部</button>
                            <button
                                class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-600 hover:text-white transition-colors">金融科技</button>
                            <button
                                class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-600 hover:text-white transition-colors">软件工具</button>
                            <button
                                class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-600 hover:text-white transition-colors">品牌营销</button>
                            <button
                                class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-600 hover:text-white transition-colors">合规服务</button>
                        </div>
                        <div class="relative  block md:hidden">
                            <select
                                class="w-full px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full outline-none border-none appearance-none pr-8 cursor-pointer">
                                <option value="全部">全部</option>
                                <option value="金融科技">金融科技</option>
                                <option value="软件工具">软件工具</option>
                                <option value="品牌营销">品牌营销</option>
                                <option value="合规服务">合规服务</option>
                            </select>
                            <svg
                                class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"
                                fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                    <a href="">
                        <button
                            class="px-3 py-1 border border-purple-600 text-purple-600 text-sm mt-[10px] rounded-full hover:bg-purple-600 hover:text-white transition-colors">申请入驻
                        </button>
                    </a>
                </div>

            </div>

            <div class="grid md:grid-cols-4 grid-cols-2 gap-4">

                <div
                    class="bg-[#fff] rounded-lg shadow-md border border-gray overflow-hidden hover:shadow-lg md:hover:[box-shadow:0_4px_12px_rgba(147,51,234,0.2)] transition-all cursor-pointer">
                    <div class="p-4">
                        <div
                            class="flex gap-3 md:flex-row md:items-center flex-col">
                            <img src="https://placehold.co/120x120" alt="logo">
                            <div class>
                                <div class="flex-1 min-w-0">
                                    <h3
                                        class="text-sm font-semibold text-gray-800 mb-1">小红书</h3>
                                    <p
                                        class="text-gray-500 text-xs line-clamp-3">小红书APP是年轻人的生活方式平台</p>
                                </div>
                                <a href="#">
                                    <button
                                        class="px-3 py-1 border border-purple-600 text-purple-600 text-xs mt-[10px] rounded-full hover:bg-purple-600 hover:text-white transition-colors">了解详情
                                    </button>
                                </a>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </main>

        <script>
            const pcButtons = document.querySelectorAll('.fenlei button');
            
            pcButtons.forEach((btn, index) => {
                btn.addEventListener('click', function() {
                    pcButtons.forEach(b => {
                        b.className = 'px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full hover:bg-purple-600 hover:text-white transition-colors';
                    });
                    this.className = 'px-3 py-1 bg-purple-600 text-white text-sm rounded-full';
                });
            });
        </script>
    </body>
</html>
